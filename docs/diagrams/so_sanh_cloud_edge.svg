<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1044" viewBox="0 0 1600 1044"><rect width="100%" height="100%" fill="white"/><text x="800" y="60" font-family="Times New Roman" font-size="48" font-weight="bold" fill="#111111" text-anchor="middle" dominant-baseline="central">So sánh vị trí xử lý ảnh</text><text x="800" y="160" font-family="Times New Roman" font-size="40" font-weight="bold" fill="#111111" text-anchor="middle" dominant-baseline="central">Xử lý trên đám mây</text><rect x="45" y="220" width="310" height="140" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="200.0" y="266.6" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Camera</text><text x="200.0" y="313.4" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">thu ảnh</text><path d="M355,290 L435,290" fill="none" stroke="#222222" stroke-width="4"/><polygon points="435,290 418.7919521576518,297.82937961400216 418.7919521576518,282.17062038599784" fill="#222222"/><rect x="445" y="220" width="310" height="140" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="600.0" y="266.6" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Mạng</text><text x="600.0" y="313.4" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Internet</text><path d="M755,290 L835,290" fill="none" stroke="#222222" stroke-width="4"/><polygon points="835,290 818.7919521576518,297.82937961400216 818.7919521576518,282.17062038599784" fill="#222222"/><rect x="845" y="220" width="310" height="140" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="1000.0" y="266.6" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Máy chủ</text><text x="1000.0" y="313.4" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">xử lý AI</text><path d="M1155,290 L1235,290" fill="none" stroke="#222222" stroke-width="4"/><polygon points="1235,290 1218.7919521576518,297.82937961400216 1218.7919521576518,282.17062038599784" fill="#222222"/><rect x="1245" y="220" width="310" height="140" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="1400.0" y="266.6" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Kết quả về</text><text x="1400.0" y="313.4" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">bộ điều khiển</text><text x="800" y="420" font-family="Times New Roman" font-size="34" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Thời gian phản hồi gồm truyền mạng và xử lý trên máy chủ.</text><text x="800" y="470" font-family="Times New Roman" font-size="34" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Chức năng kiểm định phụ thuộc kết nối tới máy chủ.</text><text x="800" y="570" font-family="Times New Roman" font-size="40" font-weight="bold" fill="#111111" text-anchor="middle" dominant-baseline="central">Xử lý tại biên (Edge AI)</text><rect x="45" y="630" width="310" height="140" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="200.0" y="676.6" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Camera</text><text x="200.0" y="723.4" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">thu ảnh</text><path d="M355,700 L435,700" fill="none" stroke="#222222" stroke-width="4"/><polygon points="435,700 418.7919521576518,707.8293796140022 418.7919521576518,692.1706203859978" fill="#222222"/><rect x="445" y="630" width="310" height="140" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="600.0" y="676.6" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Thiết bị tại trạm</text><text x="600.0" y="723.4" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">xử lý AI</text><path d="M755,700 L835,700" fill="none" stroke="#222222" stroke-width="4"/><polygon points="835,700 818.7919521576518,707.8293796140022 818.7919521576518,692.1706203859978" fill="#222222"/><rect x="845" y="630" width="310" height="140" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="1000.0" y="676.6" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Bộ điều khiển</text><text x="1000.0" y="723.4" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">nhận kết quả</text><path d="M1155,700 L1235,700" fill="none" stroke="#222222" stroke-width="4"/><polygon points="1235,700 1218.7919521576518,707.8293796140022 1218.7919521576518,692.1706203859978" fill="#222222"/><rect x="1245" y="630" width="310" height="140" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="1400.0" y="676.6" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Cơ cấu</text><text x="1400.0" y="723.4" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">phân loại</text><text x="800" y="830" font-family="Times New Roman" font-size="34" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Ảnh được xử lý tại trạm; mạng cục bộ dùng để giám sát.</text><text x="800" y="880" font-family="Times New Roman" font-size="34" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Thời gian xử lý phụ thuộc phần cứng, ảnh và thuật toán.</text></svg>