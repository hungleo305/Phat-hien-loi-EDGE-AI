62038599784 561.2080478423482,397.82937961400216" fill="#222222"/><text x="800" y="520" font-family="Times New Roman" font-size="38" font-weight="bold" fill="#111111" text-anchor="middle" dominant-baseline="central">Kết nối điều khiển và cảm biến</text><rect x="25" y="565" width="480" height="58" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="265.0" y="594.0" font-family="Times New Roman" font-size="31" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Pi → ESP32 UART2</text><rect x="505" y="565" width="1065" height="58" fill="#ffffff" stroke="#222222" stroke-width="3"/><text x="1037.5" y="594.0" font-family="Times New Roman" font-size="31" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Pin 8 / GPIO14 (TX) → GPIO16 (RX2)</text><rect x="25" y="623" width="480" height="58" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="265.0" y="652.0" font-family="Times New Roman" font-size="31" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">ESP32 UART2 → Pi</text><rect x="505" y="623" width="1065" height="58" fill="#ffffff" stroke="#222222" stroke-width="3"/><text x="1037.5" y="652.0" font-family="Times New Roman" font-size="31" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">GPIO17 (TX2) → Pin 10 / GPIO15 (RX)</text><rect x="25" y="681" width="480" height="58" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="265.0" y="710.0" font-family="Times New Roman" font-size="31" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">ESP32 → motor L298N</text><rect x="505" y="681" width="1065" height="58" fill="#ffffff" stroke="#222222" stroke-width="3"/><text x="1037.5" y="710.0" font-family="Times New Roman" font-size="31" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">GPIO14 ENA; GPIO27 IN1; GPIO26 IN2</text><rect x="25" y="739" width="480" height="58" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="265.0" y="768.0" font-family="Times New Roman" font-size="31" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">ESP32 → đèn L298N</text><rect x="505" y="739" width="1065" height="58" fill="#ffffff" stroke="#222222" stroke-width="3"/><text x="1037.5" y="768.0" font-family="Times New Roman" font-size="31" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">GPIO25 ENB; GPIO32 IN3; GPIO33 IN4</text><rect x="25" y="797" width="480" height="58" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="265.0" y="826.0" font-family="Times New Roman" font-size="31" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">ESP32 → servo SG90</text><rect x="505" y="797" width="1065" height="58" fill="#ffffff" stroke="#222222" stroke-width="3"/><text x="1037.5" y="826.0" font-family="Times New Roman" font-size="31" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">GPIO13: tín hiệu điều khiển góc</text><rect x="25" y="855" width="480" height="58" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="265.0" y="884.0" font-family="Times New Roman" font-size="31" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Cảm biến → ESP32</text><rect x="505" y="855" width="1065" height="58" fill="#ffffff" stroke="#222222" stroke-width="3"/><text x="1037.5" y="884.0" font-family="Times New Roman" font-size="31" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Vị trí chụp: GPIO18; vị trí gạt: GPIO19</text><text x="800" y="955" font-family="Times New Roman" font-size="32" font-weight="bold" fill="#111111" text-anchor="middle" dominant-baseline="central">UART dùng mức logic 3,3 V; không cấp 24 V trực tiếp vào Raspberry Pi.</text></svg>