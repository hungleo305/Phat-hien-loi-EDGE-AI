<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="997" viewBox="0 0 1600 997"><rect width="100%" height="100%" fill="white"/><text x="800" y="42" font-family="Times New Roman" font-size="44" font-weight="bold" fill="#111111" text-anchor="middle" dominant-baseline="central">Phân phối nguồn và kết nối tín hiệu</text><rect x="25" y="100" width="300" height="120" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="175.0" y="160.0" font-family="Times New Roman" font-size="36" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Nguồn 24 V DC</text><rect x="470" y="100" width="440" height="120" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="690.0" y="137.9" font-family="Times New Roman" font-size="34" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">L298N: nguồn tải</text><text x="690.0" y="182.1" font-family="Times New Roman" font-size="34" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Động cơ và đèn 24 V</text><path d="M325,160 L470,160" fill="none" stroke="#222222" stroke-width="4"/><polygon points="470,160 453.7919521576518,167.82937961400214 453.7919521576518,152.17062038599786" fill="#222222"/><rect x="1080" y="100" width="490" height="120" fill="#f3f6fa" stroke="#222222" stroke-width="3"/><text x="1325.0" y="137.9" font-family="Times New Roman" font-size="34" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">Hạ áp 24 V → 5 V</text><text x="1325.0" y="182.1" font-family="Times New Roman" font-size="34" font-weight="normal" fill="#111111" text-anchor="middle" dominant-baseline="central">ESP32, cảm biến, servo</text><path d="M175,100 L175,80" fill="none" stroke="#222222" stroke-width="4"/><polygon points="175,80 182.82937961400214,96.20804784234818 167.17062038599786,96.20804784234818" fill="#222222"/><path d="M175,80 L1325,80" fill="none" stroke="#222222" stroke-width="4"/><polygon points="1325,80 